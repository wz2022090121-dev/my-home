<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面走丢了 · 你的名字</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3EY%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f7f7fb; --surface: #ffffff; --text: #16181d; --muted: #5b6270;
    --line: #e6e7ef; --accent: #5b5bd6; --accent-text: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016; --surface: #161923; --text: #e9ebf2; --muted: #9aa2b3;
      --line: #242838; --accent: #8b8bf5; --accent-text: #12131a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.75;
  }
  .box { text-align: center; max-width: 460px; }
  .code {
    font-size: clamp(4.5rem, 20vw, 7rem);
    font-weight: 700; line-height: 1;
    letter-spacing: -.05em;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #22d3ee));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  h1 { margin: 14px 0 6px; font-size: 1.25rem; letter-spacing: -.01em; }
  p { margin: 0 0 26px; color: var(--muted); font-size: .95rem; }
  a.btn {
    display: inline-block; padding: 11px 22px; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    font-weight: 600; font-size: .95rem; text-decoration: none;
    box-shadow: 0 8px 20px -10px var(--accent);
    transition: transform .18s ease;
  }
  a.btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>地址可能打错了，或者内容已经被我挪走了。</p>
    <a class="btn" href="/">回首页</a>
  </div>
</body>
</html>
